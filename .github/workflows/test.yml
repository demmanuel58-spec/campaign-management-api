name: Automated Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Code Quality Checks (Black & Flake8)
      run: |
        black --check .
        flake8 . --max-line-length=120 --ignore=E501,W503

    - name: Run Pytest Suite with Coverage
      env:
        DATABASE_URL: sqlite:///:memory:
        SECRET_KEY: ci_test_secret_key
        ADMIN_SEED_PASSWORD: CITestPassword123!
      run: |
        pytest --cov=app --cov-report=term-missing
