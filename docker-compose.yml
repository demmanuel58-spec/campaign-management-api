version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: campaign_postgres
    restart: always
    environment:
      POSTGRES_USER: campaign_user
      POSTGRES_PASSWORD: campaign_password
      POSTGRES_DB: campaign_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign_user -d campaign_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: campaign_api
    restart: always
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://campaign_user:campaign_password@db:5432/campaign_db
      SECRET_KEY: docker_development_secret_key_change_in_production
      ALLOWED_ORIGINS: http://localhost:3000
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-AdminPass123!}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
